title: "Конспект по таджвиду (Музаккара)"
author: "Мухаммад Набхан аль-Мисри"
description: "«Музаккара фи-т-таджвид» — классический конспект по таджвиду (риваят Хафса от Асима, путём аш-Шатибийя). 30 уроков: от правил сочетания букв (нун- и мим-сакин, лам, мадд) к местам артикуляции и свойствам букв, тафхиму/таркику, идгаму, хамзе аль-васль, вакфу, ибтиде, сакту, рауму/ишмаму и выравниванию маддов. Все примеры — арабской графикой."
lessonsCount: 30
order: 5
