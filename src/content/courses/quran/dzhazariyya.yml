title: "Мукаддима аль-Джазари"
author: "Имам Мухаммад ибн аль-Джазари"
description: "Изучение поэмы по таджвиду «аль-Мукаддима аль-Джазарийя» имама Мухаммада ибн аль-Джазари (109 бейтов) с озвучкой Саада аль-Гамди и разбором по шарху Муллы Али аль-Кари. Матн разбит по главам: введение, махраджи, сыфаты, правила таджвида, ра, лям, идгам, нун с сукуном, мадд, вакф, письмо Корана и заключение. У каждого бейта — синхронная подсветка при проигрывании и раскрывающийся шарх."
